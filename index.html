<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio — PDF Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="brand">
          <span class="brand-mark">Folio</span>
        </div>

        <div class="toolbar-center">
          <div class="toolbar-group nav-group" id="navGroup" hidden>
            <button
              class="icon-btn"
              id="prevBtn"
              title="Previous page"
              aria-label="Previous page"
            >
              <svg viewBox="0 0 16 16" width="16" height="16">
                <path
                  d="M10 3 5 8l5 5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="page-field">
              <input
                type="text"
                id="pageInput"
                inputmode="numeric"
                aria-label="Current page"
                value="1"
              />
              <span class="page-sep">of</span>
              <span id="pageCount">–</span>
            </div>
            <button
              class="icon-btn"
              id="nextBtn"
              title="Next page"
              aria-label="Next page"
            >
              <svg viewBox="0 0 16 16" width="16" height="16">
                <path
                  d="M6 3l5 5-5 5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="toolbar-end">
          <div class="toolbar-group zoom-group" id="zoomGroup" hidden>
            <button
              class="icon-btn"
              id="zoomOutBtn"
              title="Zoom out"
              aria-label="Zoom out"
            >
              <svg viewBox="0 0 16 16" width="16" height="16">
                <path
                  d="M3 8h10"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button
              class="icon-btn"
              id="zoomInBtn"
              title="Zoom in"
              aria-label="Zoom in"
            >
              <svg viewBox="0 0 16 16" width="16" height="16">
                <path
                  d="M8 3v10M3 8h10"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <button class="text-btn" id="fitWidthBtn" title="Fit page to width">
              Fit width
            </button>
          </div>
          <button class="text-btn open-btn" id="openBtn">Open PDF</button>
          <input type="file" id="fileInput" accept="application/pdf" hidden />
        </div>
      </header>

      <main class="viewer" id="viewer">
        <div class="empty-state" id="emptyState">
          <div class="dropzone" id="dropzone">
            <svg
              class="doc-icon"
              viewBox="0 0 64 64"
              width="56"
              height="56"
              fill="none"
            >
              <path
                d="M18 6h20l10 10v42a2 2 0 0 1-2 2H18a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="M38 6v10h10"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="M23 34h18M23 41h18M23 27h10"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
            <p class="dropzone-title">Drop a PDF here</p>
            <p class="dropzone-sub">or choose a file from your computer</p>
            <button class="text-btn open-btn" id="emptyOpenBtn">
              Open PDF
            </button>
          </div>
        </div>

        <div class="stage-wrap" id="stageWrap" hidden>
          <div class="page-stage" id="pageStage">
            <canvas id="pdfCanvas"></canvas>
          </div>
        </div>

        <div class="loading-state" id="loadingState" hidden>
          <div class="spinner"></div>
          <p id="loadingText">Opening document…</p>
        </div>
      </main>

      <div class="toast" id="toast" hidden></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
